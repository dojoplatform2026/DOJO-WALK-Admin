name: Service Location Geometry Tests (Manual Only)

# Geometry tests are included in the single Admin full test suite.
# Keep this focused workflow available for an explicit manual diagnostic run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Format geometry files
        run: dart format --output=none --set-exit-if-changed lib/features/service_location test/features/service_location test/reference_data_integrity_test.dart
      - name: Check patch whitespace
        run: git diff --check
      - name: Analyze service-location code
        run: flutter analyze lib/features/service_location
      - name: Run service-location tests
        run: flutter test test/features/service_location test/reference_data_integrity_test.dart
