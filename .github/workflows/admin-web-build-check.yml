name: Admin Web Build Check (Manual Only)

# Automatic Analyze + tests + Web build are centralized in
# admin-main-full-validation.yml to prevent duplicate CI runs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze complete Admin project
        run: flutter analyze
      - name: Run complete Admin test suite
        run: flutter test
      - name: Build Flutter Web (no deployment)
        run: flutter build web --release
