name: DOJO WALK Admin — Single CI (Analyze + Tests + Web Build)

on:
  pull_request:
    branches:
      - main
    paths:
      - '**.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
      - 'web/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
      - ui/notion-brand-foundation-2026-10-28
    paths:
      - '**.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
      - 'web/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dojo-admin-single-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-validation:
    name: Analyze, full test suite and Flutter Web build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Patch whitespace check
        run: git diff --check

      - name: Static analysis
        run: flutter analyze

      - name: Run complete Admin test suite
        run: flutter test

      - name: Build Flutter Web (no deployment)
        run: flutter build web --release
